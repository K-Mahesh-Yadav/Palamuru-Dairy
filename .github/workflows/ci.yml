name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads code and uploads an artifact.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` not `npm install` — installs exactly the committed lockfile
      # and fails if package.json and the lockfile have drifted apart.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Token gate (no hex outside tokens.css)
        run: npm run lint:tokens

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Post-build security checks
        run: npm run verify:dist

      # --omit=dev deliberately: frontend audit noise is dominated by dev-only
      # transitive advisories that never reach a user. The full report is
      # reviewed separately rather than gating the build on it.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      # NON-BLOCKING for the first two weeks so the budget can be calibrated
      # against real runs before it can block a deploy. Then remove this line.
      - name: Lighthouse CI
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
